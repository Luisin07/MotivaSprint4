# ===== BLOCO 1: aplicacao =====
spring.application.name=motiva-api
server.port=8080

# ===== BLOCO 2: banco_oracle (credenciais por variavel de ambiente ou .env local fora do Git) =====
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===== BLOCO 3: pool_hikari (o Oracle da FIAP limita sessoes por usuario) =====
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ===== BLOCO 4: jpa (tabelas criadas pelo sql/script-criacao.sql, o Hibernate NAO mexe no schema) =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
